version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: devcollab-mongodb-prod
    restart: always
    volumes:
      - mongodb_data_prod:/data/db
    networks:
      - devcollab-network-prod

  redis:
    image: redis:alpine
    container_name: devcollab-redis-prod
    restart: always
    networks:
      - devcollab-network-prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devcollab-backend-prod
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/devcollab
      - REDIS_URL=redis://redis:6379
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=${GITHUB_CALLBACK_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - FRONTEND_URL=http://localhost
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb
      - redis
    networks:
      - devcollab-network-prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devcollab-frontend-prod
    restart: always
    environment:
      - NODE_ENV=production
      - VITE_SOCKET_URL=http://localhost
    networks:
      - devcollab-network-prod

  nginx:
    image: nginx:alpine
    container_name: devcollab-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - devcollab-network-prod

networks:
  devcollab-network-prod:
    driver: bridge

volumes:
  mongodb_data_prod:
    driver: local
